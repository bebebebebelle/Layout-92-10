<!DOCTYPE html>
<html>
    <head>
        <title>Orderlist dan Unorderlist</title>
        <style>
            ul{
                list-style-type: circle;
            }
            ol.a{
                list-style-type: lower-alpha;
            }
            ol{
                background-color: lightgreen;
            }
    
        </style>
    </head>
    <body>
        <h2>Menu Makanan dan Minuman</h2>
        <p>Makanan</p>
        <ol>
            <li>MCD</li>
            <ul>
                <li>Kentang Goreng</li>
            </ul>
            <li>KFC</li>
            <ol class="a">
                <li>Kentang Goreng</li>
            
                <li>Ayam Geprek</li>
        </ol>
        <p>Minuman</p>
        <ul>
            <li>Sprite</li>
            <li>Air Mineral</li>
            <li>Jus Alpukat</li>
        </ul>
        <h2>Icon pada HTML</h2>
        <i class="fas fa-camera"></i>

    </body>
</html>
